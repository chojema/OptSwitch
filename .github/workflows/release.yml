name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number is the commit count

      - name: Check tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Test
        run: scripts/test.sh

      - name: Build
        run: scripts/build-app.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$(cat VERSION)" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > build/notes.md
          gh release create "$GITHUB_REF_NAME" build/*.zip build/*.sha256 --title "$GITHUB_REF_NAME" --notes-file build/notes.md
